<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Endless Runner</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-container">
    <div id="player" class="player"></div>
    <div id="obstacle" class="obstacle structural-block"></div>
    <!-- UI overlays -->
    <div id="score" class="ui">Score: 0</div>
    <div id="high-score" class="ui" style="right:10px; left:auto;">High Score: 0</div>
    <div id="level" class="ui" style="top:40px; left:10px;">Level: 1</div>
    <div id="level-flash" class="flash"></div>
    <div id="mission-intel" class="mission"></div>
    <div id="game-over" class="game-over hidden">
      <h1>Game Over</h1>
      <p id="final-score"></p>
      <button id="restart-btn">Restart</button>
    </div>
  </div>
  <script type="module" src="js/obstacles.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
